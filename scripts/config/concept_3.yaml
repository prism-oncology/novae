data:
  train_dataset: /gpfs/workdir/blampeyq/res_novae/X_scConcept3
  val_dataset: /gpfs/workdir/blampeyq/res_novae/X_scConcept3_validation2

model_kwargs:
  embedding_name: "X_scConcept"
  embedding_size: 512
  background_noise_lambda: 0.001
  sensitivity_noise_std: 0.001
  n_hops_view: 2
  heads: 16
  hidden_size: 512
  output_size: 128
  temperature: 0.08
  num_prototypes: 512
  panel_subset_size: 0

fit_kwargs:
  max_epochs: 35
  lr: 0.00003
  accelerator: "gpu"
  num_workers: 8
  patience: 6
  min_delta: 0.025

post_training:
  n_domains: [15, 20, 25]
  log_metrics: true
  log_umap: true
  log_domains: true
