name: ci

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1,3,5"

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Run checks
        run: uv run --locked poe pre-commit

  tests:
    needs: [pre-commit]
    name: "pytest with uv"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: uv run pytest --cov --junitxml=junit.xml -o junit_family=legacy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test_pip_install:
    needs: [pre-commit]
    name: "pytest with pip install"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pip installation
        run: pip install -e . && pip install pytest-cov poethepoet

      - name: Run short tests
        run: poe test_no_multimodal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  deploy-docs:
    needs: [tests, test_pip_install]
    if: contains(github.ref, 'tags')
    name: "Deploy documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run mkdocs gh-deploy --force

  pypi-release:
    needs: [tests, test_pip_install]
    if: contains(github.ref, 'tags')
    name: "PyPI release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish -t ${{ secrets.PYPI_TOKEN }}
